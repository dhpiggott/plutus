name: Set up the Plutus build
description: >-
  Installs the JDK, sbt and Homebrew packages the build needs on a macOS runner,
  and restores the caches a cold build would otherwise rebuild from scratch.

runs:
  using: composite
  steps:
    - name: Install Homebrew build dependencies
      shell: bash
      run: .github/scripts/install-build-deps.sh

    # JDK 22+: the Keychain and sqlite3 JVM bindings use the Foreign Function &
    # Memory API, which is only final from 22 onwards.
    - name: Set up the JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "25"

    - name: Set up sbt
      uses: sbt/setup-sbt@v1

    # Not using setup-java's `cache: sbt`: it caches ~/.cache/coursier, but on
    # macOS coursier defaults to ~/Library/Caches/Coursier and the cache misses
    # entirely.
    - name: Cache sbt and coursier
      uses: actions/cache@v6
      with:
        path: |
          ~/.sbt
          ~/Library/Caches/Coursier
        key: sbt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt') }}
        restore-keys: |
          sbt-${{ runner.os }}-${{ runner.arch }}-

    # sbt-vcpkg-native builds sqlite3 from source on first compile of the
    # native row, which is the single slowest thing in a cold build.
    - name: Cache the vcpkg-built sqlite3
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/sbt-vcpkg
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sbt', 'project/plugins.sbt') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-

    # sbt-jextract downloads a ~150MB jextract distribution from
    # download.java.net into the build's stream cache. The version is pinned by
    # the plugin, so plugins.sbt is the right thing to key on — but any of the
    # dozen plugins pinned there changes the hash, so restore-keys keeps an
    # unrelated bump from forcing the download again.
    - name: Cache the jextract distribution
      uses: actions/cache@v6
      with:
        path: target/streams/_build/_global/jextractBinary
        key: jextract-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project/plugins.sbt') }}
        restore-keys: |
          jextract-${{ runner.os }}-${{ runner.arch }}-
