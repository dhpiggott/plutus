name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR builds, but never a build of main: those are the runs
  # that populate the caches every other run restores from, and the only ones
  # that link the native binary.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    # macOS only, and not just for the native row: the JVM row's Keychain and
    # sqlite3 bindings are generated against the macOS SDK too, so nothing in
    # this build compiles on Linux.
    runs-on: macos-latest
    # Warm runs take about three minutes and the slowest cold one seen took
    # six, so this is roughly 2.5x the worst case: a genuine cache miss still
    # finishes, and a hung job is caught in a quarter of an hour rather than
    # burning most of an hour of macOS runner time.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # sbt-dynver derives `version` from the tag history, and `version`
          # ends up in BuildInfo. A shallow clone silently produces 0.0.0+….
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Check formatting and compile both platform rows
        run: .github/scripts/verify.sh

      # Linking is where the native row's link flags get exercised (s2n from
      # Homebrew, the CoreFoundation and Security frameworks, vcpkg's
      # libsqlite3.a), and none of that shows up at compile time. It is slow, so
      # only on main rather than on every push to a PR.
      - name: Link the native binary
        if: github.event_name == 'push'
        run: sbt --batch -no-colors "mainNative3/nativeLink"
