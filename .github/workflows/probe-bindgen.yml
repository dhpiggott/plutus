name: Probe bindgen

# Temporary, removed before this branch is merged: measures how often the
# sn-bindgen binary crashes on keychain's macos.h under different conditions.
on:
  push:
    branches: [claude/dazzling-fermat-9t7xgs]

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "0.4.4 par4 baseline", version: "0.4.4", parallelism: 4, nothreads: "", nocrashrec: "", iterations: 3000 }
          - { name: "0.4.4 par4 NOCRASHREC a", version: "0.4.4", parallelism: 4, nothreads: "", nocrashrec: "1", iterations: 3000 }
          - { name: "0.4.4 par4 NOCRASHREC b", version: "0.4.4", parallelism: 4, nothreads: "", nocrashrec: "1", iterations: 3000 }
          - { name: "0.4.4 seq NOCRASHREC", version: "0.4.4", parallelism: 1, nothreads: "", nocrashrec: "1", iterations: 1500 }
    steps:
      - uses: actions/checkout@v7
      - name: Install Homebrew build dependencies
        run: .github/scripts/install-build-deps.sh
      - name: Run the probe
        env:
          PROBE_NOTHREADS: ${{ matrix.nothreads }}
          PROBE_NOCRASHREC: ${{ matrix.nocrashrec }}
        run: .github/scripts/probe-bindgen.sh ${{ matrix.version }} ${{ matrix.iterations }} ${{ matrix.parallelism }}

  sbt:
    name: Probe sbt loop
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up the build
        uses: ./.github/actions/setup-build
      - name: Regenerate bindings from clean, repeatedly
        run: .github/scripts/probe-bindgen-sbt.sh 60
