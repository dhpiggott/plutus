name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Every mention is a prompt that has to be answered exactly once, so neither
# end of the queue may be dropped. cancel-in-progress: false protects the
# running session, which by then has usually pushed commits and posted
# comments. queue: max protects the waiting one: the default, queue: single,
# holds at most one pending run and cancels it when a newer one arrives, so
# mentioning @claude twice while a session is busy loses the first prompt with
# nothing to show that it was ever asked.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  claude:
    name: Claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # macOS, so that Claude can build what it changes: every module generates
    # its FFI bindings against the macOS SDK, so nothing here compiles on Linux.
    runs-on: macos-latest
    timeout-minutes: 60
    # These scope `${{ github.token }}`, and Claude does not work through it:
    # the action puts the app token from the OIDC exchange into both
    # GITHUB_TOKEN and GH_TOKEN in Claude's environment, and hardcodes that
    # token's permissions as contents/pull_requests/issues write whatever is
    # written here. Editing files goes through `mcp__github_file_ops__commit_files`,
    # which is Octokit against that same token — which is also how
    # `use_commit_signing` below gets GitHub to sign what Claude pushes.
    #
    # `contents: read` is the deliberate one. `actions/checkout` persists this
    # token into `.git/config`, so it is what a raw `git push` from the
    # allowlisted `Bash(git:*)` would authenticate with. That path is not
    # wanted — it bypasses the signing above, and the ruleset on `main` rejects
    # unsigned commits — so read makes it fail loudly rather than quietly
    # produce commits that cannot merge.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # sbt-dynver needs the tag history to derive `version` for BuildInfo,
          # and a full clone also lets Claude read git history while it works.
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This, not the `actions: read` in `permissions:` above, is what lets
          # Claude read CI results on PRs: the action parses this string and
          # asks the token exchange for it, on top of the write permissions it
          # always requests.
          additional_permissions: |
            actions: read

          use_commit_signing: true

          # claude[bot]; the action defaults to github-actions[bot]'s ID —
          # anthropics/claude-code-action#759
          bot_id: "209825114"
          bot_name: "claude[bot]"

          # Installed, never invoked on its own: this workflow has no `prompt`,
          # so it takes its instructions from the comment that mentioned
          # Claude, and all these two lines do is put the review skill within
          # reach of one. Ask for it by name:
          #
          #   @claude /code-review:code-review --comment ${{ github.repository }}/pull/<N>
          #
          # `--comment` is load-bearing rather than decorative. The skill's
          # step 7 reads "If `--comment` argument was NOT provided, stop here.
          # Do not post any GitHub comments", so without it a review that finds
          # something is instructed to keep it to itself.
          #
          # The skill is agents all the way down — a haiku eligibility check, a
          # haiku CLAUDE.md-path lister, a sonnet summariser, four parallel
          # reviewers (two sonnet on CLAUDE.md compliance, two opus on bugs),
          # then a validator subagent per finding — so it needs `Skill` and
          # `Task`, and the action grants neither. That is what killed the
          # review workflow this repo used to have. It works here only because
          # of `--permission-mode auto` below, which sends both to the
          # classifier rather than to the floor.
          #
          # Two of the four reviewers exist to check CLAUDE.md compliance,
          # which is the real argument for the skill over an unaided review in
          # this repo: rules like the sn-bindgen system-header workaround or
          # `nativeConfig ~=` having to append are quotable, and quotable is
          # exactly what the skill tells its agents to require.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Without --model the run takes the account-type default, which for
          # this seat is Sonnet; local work on this repo is on Opus, and the
          # asymmetry is invisible from either side.
          #
          # `--permission-mode auto` is what keeps the allowlist this short.
          # The action sets `acceptEdits` and runs headless, and headless has
          # no prompt to fall back on, so under that mode every tool call the
          # allowlist did not name was denied outright, and greenly. That is
          # how the review workflow this replaces went from 26 July to #32 on
          # 15 August unable to invoke its own review skill: every run of it
          # wasted, none of them failing. Under auto mode the unnamed calls go
          # to the classifier instead of the floor, so `sbt`, `git`, `gh`,
          # `verify.sh` and the `brew list` / `xcrun --show-sdk-path`
          # diagnostics are all still reachable, on the merits, without being
          # enumerated here. This relies on our args being appended after the
          # action's own `--permission-mode`, so last flag wins.
          #
          # What that does not cover, and why one entry survives: listing an
          # `mcp__github_*` tool is not only a permission, it is what
          # provisions the server. install-mcp-server.ts starts
          # github_inline_comment only when something matching that prefix
          # appears in the allowlist, so dropping it would not leave the tool
          # to the classifier — the tool would not exist. It is what makes
          # "@claude review this" land on the lines it concerns.
          #
          # Auto mode reshapes the silent failure rather than removing it: a
          # classifier block in a headless run has nothing to fall back to, so
          # the action simply does not run and Claude carries on to a green
          # job. `permission_denials_count` in the run log stays the tell.
          claude_args: |
            --model opus
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
