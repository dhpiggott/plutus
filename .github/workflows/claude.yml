name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Every mention is a prompt that has to be answered exactly once, so neither
# end of the queue may be dropped. cancel-in-progress: false protects the
# running session, which by then has usually pushed commits and posted
# comments. queue: max protects the waiting one: the default, queue: single,
# holds at most one pending run and cancels it when a newer one arrives, so
# mentioning @claude twice while a session is busy loses the first prompt with
# nothing to show that it was ever asked.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  claude:
    name: Claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # macOS, so that Claude can build what it changes: every module generates
    # its FFI bindings against the macOS SDK, so nothing here compiles on Linux.
    runs-on: macos-latest
    timeout-minutes: 60
    # These scope `${{ github.token }}`, and Claude does not work through it:
    # the action puts the app token from the OIDC exchange into both
    # GITHUB_TOKEN and GH_TOKEN in Claude's environment, and hardcodes that
    # token's permissions as contents/pull_requests/issues write whatever is
    # written here. Editing files goes through `mcp__github_file_ops__commit_files`,
    # which is Octokit against that same token — which is also how
    # `use_commit_signing` below gets GitHub to sign what Claude pushes.
    #
    # `contents: read` is the deliberate one. `actions/checkout` persists this
    # token into `.git/config`, so it is what a raw `git push` from the
    # allowlisted `Bash(git:*)` would authenticate with. That path is not
    # wanted — it bypasses the signing above, and the ruleset on `main` rejects
    # unsigned commits — so read makes it fail loudly rather than quietly
    # produce commits that cannot merge.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # sbt-dynver needs the tag history to derive `version` for BuildInfo,
          # and a full clone also lets Claude read git history while it works.
          fetch-depth: 0

      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This, not the `actions: read` in `permissions:` above, is what lets
          # Claude read CI results on PRs: the action parses this string and
          # asks the token exchange for it, on top of the write permissions it
          # always requests.
          additional_permissions: |
            actions: read

          use_commit_signing: true

          # claude[bot]; the action defaults to github-actions[bot]'s ID —
          # anthropics/claude-code-action#759
          bot_id: "209825114"
          bot_name: "claude[bot]"

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Without --model the run takes the account-type default, which for
          # this seat is Sonnet; local work on this repo is on Opus, and the
          # asymmetry is invisible from either side.
          #
          # The action grants no Bash access by default, so without an allowlist
          # Claude cannot run sbt and can only guess whether its changes
          # compile. Everything else it needs (reading, editing, committing) is
          # on by default.
          #
          # `brew list` and `xcrun` are diagnostic, not build steps: the build
          # reaches both by itself, `build.sbt` shelling out to
          # `xcrun --show-sdk-path` and setup-build running `brew install`, and
          # neither needs a grant to do that. They are here because this repo's
          # two worst build failures are silent ones. A missing `llvm@17` makes
          # sn-bindgen abort with exit 134 and no diagnostic, and an SDK path
          # that doesn't resolve yields empty bindings rather than an error, so
          # `brew list` and `xcrun --show-sdk-path` are how those two get told
          # apart from an ordinary compile error. Note `brew list` and not
          # `brew` — installing is setup-build's job, not Claude's.
          #
          # The inline-comment entry is what makes "@claude review this" leave
          # findings on the lines they concern rather than as one wall of prose
          # in the thread. Listing it does two jobs: the action's
          # install-mcp-server.ts only starts the github_inline_comment MCP
          # server when something matching that prefix appears in the
          # allowlist, so without it the tool is not merely denied, it does not
          # exist.
          claude_args: |
            --model opus
            --allowedTools "Bash(.github/scripts/verify.sh),Bash(sbt:*),Bash(git:*),Bash(gh:*),Bash(brew list:*),Bash(xcrun:*),mcp__github_inline_comment__create_inline_comment"
