name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude review
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    # Linux on purpose: reviewing is read-only, so it needs neither the macOS
    # SDK nor Homebrew nor a JDK, and staying off macOS keeps reviews quick.
    # Whether the PR compiles is the CI workflow's job. Swap in macos-latest
    # plus the ./.github/actions/setup-build step to let the reviewer build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Lets the review read this PR's CI results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses to run for a non-User actor, so Claude's own
          # pushes to a PR branch fail this workflow — and it is a required
          # check, so the PR then cannot merge until a human pushes. Safe to
          # allow here because reviewing never pushes, so it cannot cycle;
          # don't copy this to claude.yml, where Claude does push.
          allowed_bots: "claude"
          # Supplying a prompt puts the action in automation mode, where
          # findings go to the run log and never reach the PR — so every review
          # so far has been written somewhere nobody reads. This forces tag
          # mode, which posts a tracking comment instead.
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          additional_permissions: |
            actions: read

          # No --max-turns, deliberately: the flag has no default anywhere in
          # the chain, so omitting it leaves turns unbounded. #27 set 30 here
          # believing the default was 10 and that the default had truncated the
          # review on #6 — but this workflow had no claude_args at all until
          # #27, so that run was already unbounded and turns cannot have been
          # what stopped it. The Skill denial fixed in #32 was.
          #
          # Any number here is a cliff rather than a budget. The review of #6
          # that succeeded once Skill was allowed took 22 turns (run
          # 31893928695, 16 minutes) against the 30, so a diff half again as
          # large would have failed the required check for reasons unrelated to
          # the code — loudly, since hitting the cap ends the run as
          # error_max_turns, which the action reports as a failure.
          # timeout-minutes above is the bound that actually matters.
          #
          # `Skill` is not in the action's default tool set, so the one thing
          # this workflow exists to do — invoke code-review:code-review — was
          # denied on every run since it was written. Claude fell back to
          # reviewing unaided, which worked on small diffs and died retrying on
          # large ones. The skill grants its own tools through frontmatter once
          # it can start, so this should be the only entry needed.
          claude_args: |
            --allowedTools "Skill"
