name: Claude Code Review

on:
  pull_request:
    # No `synchronize`: that fires on every push, so a PR was re-reviewed from
    # scratch each time it was touched — #6 was reviewed four times. One review
    # per pull request instead. The cost is that a PR rewritten after its review
    # keeps a green check describing the old diff; re-request by reopening, or
    # push a review request by hand, when that matters.
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude review
    # A draft opened for review gets one at ready_for_review; reviewing it twice
    # spends the quota twice. This has to be a job-level `if`, not a narrower
    # `types:` list — a job skipped by a condition still reports its check,
    # where a workflow filtered out by its triggers reports nothing at all, and
    # `Claude review` is a required check.
    if: '!github.event.pull_request.draft'
    # Linux on purpose: reviewing is read-only, so it needs neither the macOS
    # SDK nor Homebrew nor a JDK, and staying off macOS keeps reviews quick.
    # Whether the PR compiles is the CI workflow's job. Swap in macos-latest
    # plus the ./.github/actions/setup-build step to let the reviewer build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This block scopes `${{ github.token }}`, and only `actions/checkout` uses
    # that token — so the two load-bearing lines are `contents: read` and
    # `id-token: write`, the latter being what lets the job mint the OIDC token
    # the action trades for an app token. Claude reaches GitHub through that app
    # token, whose permissions the action hardcodes as contents/pull_requests/
    # issues write regardless of what is written here. So `pull-requests: read`
    # does not stop the review posting inline comments — it did, on the #40
    # probe — and raising it to write would grant nothing. Read-only is the
    # point: a step that goes wrong cannot write with this token.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses to run for a non-User actor, so Claude's own
          # pushes to a PR branch fail this workflow — and it is a required
          # check, so the PR then cannot merge until a human pushes. Safe to
          # allow here because reviewing never pushes, so it cannot cycle;
          # don't copy this to claude.yml, where Claude does push.
          allowed_bots: "claude"
          # Supplying a prompt puts the action in automation mode, where
          # findings go to the run log and never reach the PR — so every review
          # so far has been written somewhere nobody reads. This forces tag
          # mode, which posts a tracking comment instead.
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` is load-bearing, not a nicety. The skill's step 7 reads
          # "If `--comment` argument was NOT provided, stop here. Do not post
          # any GitHub comments" — so without it a review that finds something
          # is instructed to keep it to itself. The #40 probe posted a comment
          # without the flag only because that run did not follow the skill's
          # protocol; that is luck, not configuration.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # This, not the `actions: read` in `permissions:` above, is what lets
          # the review read this PR's CI results: the action parses this string
          # and asks the token exchange for it, on top of the write permissions
          # it always requests.
          additional_permissions: |
            actions: read

          # The action's tool set is narrower than the skill assumes, and every
          # gap fails the same silent-and-green way. `Skill` was missing until
          # #32, which denied the review outright. `Task` was missing until
          # #45, and the skill is agents all the way down — a haiku eligibility
          # check, a sonnet summariser, four parallel reviewers, then a
          # validator per finding — so #43 planned the fan-out, collected ten
          # permission denials, and reported success having posted nothing.
          # `gh pr comment` is the skill's step-7 path for the no-issues-found
          # summary; the inline tool covers the issues-found path.
          claude_args: |
            --allowedTools "Skill,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
