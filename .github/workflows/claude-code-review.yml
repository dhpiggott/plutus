name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude review
    # Linux on purpose: reviewing is read-only, so it needs neither the macOS
    # SDK nor Homebrew nor a JDK, and staying off macOS keeps reviews quick.
    # Whether the PR compiles is the CI workflow's job. Swap in macos-latest
    # plus the ./.github/actions/setup-build step to let the reviewer build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Lets the review read this PR's CI results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses to run for a non-User actor, so Claude's own
          # pushes to a PR branch fail this workflow — and it is a required
          # check, so the PR then cannot merge until a human pushes. Safe to
          # allow here because reviewing never pushes, so it cannot cycle;
          # don't copy this to claude.yml, where Claude does push.
          allowed_bots: "claude"
          # Supplying a prompt puts the action in automation mode, where
          # findings go to the run log and never reach the PR — so every review
          # so far has been written somewhere nobody reads. This forces tag
          # mode, which posts a tracking comment instead.
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          additional_permissions: |
            actions: read

          # `Skill` is not in the action's default tool set, so the one thing
          # this workflow exists to do — invoke code-review:code-review — was
          # denied on every run from the day it was written until #32. Claude
          # fell back to reviewing unaided, which read as working on small diffs
          # and died retrying on large ones.
          claude_args: |
            --allowedTools "Skill"
