version = "3.11.5"
runner.dialect = scala3
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true
# DefinitionOrder's test fixtures are the rule's exact input and expected
# output, so formatting them would change what they test.
project.excludePaths = [
  "glob:**/scalafix-tests/input/**"
  "glob:**/scalafix-tests/output/**"
]

fileOverride {
  "glob:**/project/**" {
    runner.dialect = sbt1
  }
  "glob:**/**.sbt" {
    runner.dialect = sbt1
  }
  # Scalafix rules, and their test runner, are compiled for Scala 2.13.
  "glob:**/{scalafix-rules,scalafix-tests/unit}/**" {
    runner.dialect = scala213
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces = false
  }
}
