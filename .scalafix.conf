rules = [
  OrganizeImports
  DefinitionOrder
]
OrganizeImports.targetDialect = Auto
# The two deliberate exceptions to the definition-order convention, for the
# reasons CLAUDE.md gives: an inlined upstream fork kept diffable against it,
# and a file that follows smithy4s's own codec objects.
DefinitionOrder.exclude = [
  "porcupine/src/main/scala/"
  "/TokenExchangeCodecs\\.scala$"
]
