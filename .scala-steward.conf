# Every pull request is a full macOS build, so routine bumps share one. Majors
# get one each, because they are the ones likely to break, and a break in a
# shared pull request would hold up everything else in it.
pullRequests.grouping = [
  { name = "patches-and-minors", title = "Update patch and minor versions", filter = [{ version = "patch" }, { version = "minor" }] }
]

# The default list minus ".yml": Dependabot owns the GitHub Actions pins, and
# nothing in .github names a Scala dependency, so this just keeps Steward from
# opening pull requests that compete with it.
updates.fileExtensions = [".mill", ".sbt", ".sbt.shared", ".sc", ".scala", ".scalafmt.conf", ".sdkmanrc", "build.properties", "libs.versions.toml", "mill-version", "mise.toml", "mise/config.toml", "pom.xml"]
